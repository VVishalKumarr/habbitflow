# Supabase CLI settings used when deploying Edge Functions.
# JWT checks are done inside each function (the project uses the new
# publishable API keys, which the gateway's legacy JWT check doesn't accept),
# and the Razorpay webhook is authenticated by its HMAC signature instead.
project_id = "udugejhizotqfmzqpnzf"

[functions.account-email]
verify_jwt = false

[functions.password-reset]
verify_jwt = false

